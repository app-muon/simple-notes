[versions]
agp = "9.3.3"
kotlin = "2.4.20"
ksp = "2.3.10"
compose = "2026.09.00"
room = "2.8.5"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.11.0" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.11.0" }
fragment = { module = "androidx.fragment:fragment-ktx", version = "1.9.1" }
biometric = { module = "androidx.biometric:biometric", version = "1.1.0" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.2.1" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version = "4.19.1" }
tink = { module = "com.google.crypto.tink:tink-android", version = "1.23.0" }
junit = { module = "junit:junit", version = "4.13.2" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.10.2" }
android-test = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
